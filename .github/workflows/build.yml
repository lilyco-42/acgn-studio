name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Patch pywebview plugin (add win32 support)
        run: |
          $pluginFile = Get-ChildItem -Recurse -Path ".venv" -Filter "PywebViewPlugin.py" | Select-Object -First 1 -ExpandProperty FullName
          if ($pluginFile) {
            $content = Get-Content $pluginFile -Raw
            $content = $content -replace '"webview\.platforms\.winforms",', "`"webview.platforms.win32`",`"webview.platforms.winforms`","
            Set-Content $pluginFile $content -NoNewline
            Write-Host "Patched: $pluginFile"
          } else {
            Write-Warning "PywebViewPlugin.py not found, skipping patch"
          }

      - name: Build with Nuitka
        run: uv run python build_nuitka.py ${{ inputs.mode || 'release' }}

      - name: Check build output
        run: |
          if (Test-Path "build/ui.dist/ACGN-Studio.exe") {
            Write-Host "Build successful!"
            Get-ChildItem build/ui.dist/ | Select-Object Name,Length
          } elseif (Test-Path "build/ACGN-Studio.dist/ACGN-Studio.exe") {
            Write-Host "Build successful!"
            Get-ChildItem build/ACGN-Studio.dist/ | Select-Object Name,Length
          } else {
            Get-ChildItem build/ -Recurse -Filter "*.exe" | Select-Object FullName
            Write-Error "Build failed - exe not found"
            exit 1
          }

      - name: Package
        run: |
          if (Test-Path "build/ui.dist") {
            Compress-Archive -Path build/ui.dist/* -DestinationPath ACGN-Studio-windows.zip
          } else {
            Compress-Archive -Path build/ACGN-Studio.dist/* -DestinationPath ACGN-Studio-windows.zip
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACGN-Studio-windows
          path: ACGN-Studio-windows.zip

      - name: Update release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ACGN-Studio-windows.zip
          generate_release_notes: true
