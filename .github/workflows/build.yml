name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.1)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Patch pywebview plugin
        run: |
          $pluginFile = Get-ChildItem -Recurse -Path ".venv" -Filter "PywebViewPlugin.py" | Select-Object -First 1 -ExpandProperty FullName
          if ($pluginFile) {
            $content = Get-Content $pluginFile -Raw
            $content = $content -replace '"webview\.platforms\.winforms",', "`"webview.platforms.win32`",`"webview.platforms.winforms`","
            Set-Content $pluginFile $content -NoNewline
          }

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "refs/tags/(v.*)") {
            $tag = $Matches[1]
          } elseif ("${{ inputs.version }}" -ne "") {
            $tag = "${{ inputs.version }}"
          } else {
            $date = Get-Date -Format "yyyyMMdd-HHmm"
            $tag = "v0.1.$date"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $tag"

      - name: Build with Nuitka
        run: uv run python build_nuitka.py release

      - name: Package
        run: |
          if (Test-Path "build/ui.dist") {
            Compress-Archive -Path build/ui.dist/* -DestinationPath ACGN-Studio-windows.zip
          } else {
            Compress-Archive -Path build/ACGN-Studio.dist/* -DestinationPath ACGN-Studio-windows.zip
          }

      - name: Create tag
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: ACGN-Studio-windows.zip
          generate_release_notes: true
