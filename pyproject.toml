[project]
name = "search"
version = "0.1.0"
description = "明日方舟干员数据平台 — 搜索、浏览、下载角色立绘与语音素材"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.139.2",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "jinja2>=3.1.6",
    "lxml>=6.1.1",
    "meilisearch>=0.42.0",
    "mwparserfromhell>=0.7.2",
    "nuitka>=4.1.3",
    "parsel>=1.11.0",
    "pillow>=12.3.0",
    "playwright>=1.61.0",
    "pydantic-settings>=2.14.2",
    "pyinstaller>=6.21.0",
    "pywebview>=6.2.1",
    "sqlite-utils>=4.1.1",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
