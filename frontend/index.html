<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACGN Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23f4c430'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='%231e1e2e' font-family='Arial' font-weight='bold'>A</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 20px 32px; border-bottom: 1px solid #2a2a3e; }
        .header h1 { font-size: 20px; color: #f4c430; font-weight: 600; }
        .header p { font-size: 12px; color: #888; margin-top: 4px; }
        .search-bar { display: flex; gap: 12px; margin-top: 16px; }
        .search-bar input { flex: 1; padding: 10px 16px; border-radius: 8px; border: 1px solid #333; background: #1e1e2e; color: #fff; font-size: 14px; outline: none; }
        .search-bar input:focus { border-color: #f4c430; }
        .search-bar button { padding: 10px 24px; border-radius: 8px; border: none; background: #f4c430; color: #000; font-weight: 600; cursor: pointer; font-size: 14px; }
        .search-bar button:hover { background: #e6b800; }
        .stats { padding: 12px 32px; font-size: 12px; color: #666; border-bottom: 1px solid #1e1e2e; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 24px 32px; }
        .card { background: #1a1a2e; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #2a2a3e; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(244, 196, 48, 0.1); }
        .card-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #12121e; }
        .card-body { padding: 12px 16px; }
        .card-name { font-size: 16px; font-weight: 600; color: #fff; }
        .card-meta { font-size: 12px; color: #888; margin-top: 4px; display: flex; gap: 8px; }
        .card-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
        .tag-rarity { background: #f4c43022; color: #f4c430; }
        .tag-profession { background: #36c2; color: #88a3e8; }
        .tag-faction { background: #2cb49122; color: #2cb491; }
        .detail-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 100; overflow-y: auto; }
        .detail-overlay.active { display: block; }
        .detail-panel { max-width: 900px; margin: 40px auto; background: #1a1a2e; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a3e; }
        .detail-close { position: fixed; top: 16px; right: 24px; width: 36px; height: 36px; border-radius: 50%; border: none; background: #333; color: #fff; font-size: 18px; cursor: pointer; z-index: 101; }
        .detail-illustration { width: 100%; max-height: 500px; object-fit: contain; background: #12121e; }
        .detail-info { padding: 24px; }
        .detail-name { font-size: 24px; font-weight: 700; color: #fff; }
        .detail-tags { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .detail-section { margin-top: 20px; }
        .detail-section h3 { font-size: 14px; color: #f4c430; margin-bottom: 8px; border-bottom: 1px solid #2a2a3e; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .detail-section h3 .batch-btn { font-size: 12px; padding: 4px 12px; border-radius: 6px; border: 1px solid #f4c430; background: transparent; color: #f4c430; cursor: pointer; font-weight: 400; }
        .detail-section h3 .batch-btn:hover { background: #f4c43022; }
        .voice-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #1e1e2e; }
        .voice-item:last-child { border-bottom: none; }
        .voice-play { width: 32px; height: 32px; border-radius: 50%; border: none; background: #f4c430; color: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; }
        .voice-play:hover { background: #e6b800; }
        .voice-title { font-size: 13px; color: #aaa; min-width: 80px; }
        .voice-text { font-size: 13px; color: #ccc; flex: 1; }
        .voice-dl { width: 28px; height: 28px; border-radius: 6px; border: 1px solid #444; background: transparent; color: #aaa; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; }
        .voice-dl:hover { border-color: #f4c430; color: #f4c430; }
        .voice-dl.done { border-color: #2cb491; color: #2cb491; }
        .voice-copy { width: 28px; height: 28px; border-radius: 6px; border: 1px solid #444; background: transparent; color: #aaa; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; }
        .voice-copy:hover { border-color: #88a3e8; color: #88a3e8; }
        .voice-copy.copied { border-color: #2cb491; color: #2cb491; }
        .illustration-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .illust-card { position: relative; border-radius: 8px; overflow: hidden; background: #12121e; }
        .illust-card img { width: 100%; display: block; }
        .illust-card .illust-dl { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(0,0,0,0.7); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; opacity: 0; transition: opacity 0.2s; }
        .illust-card:hover .illust-dl { opacity: 1; }
        .illust-card .illust-dl:hover { background: #f4c430; color: #000; }
        .illust-card .illust-dl.done { background: #2cb491; }
        .illust-label { font-size: 11px; color: #888; padding: 6px 8px; text-align: center; }
        .empty { text-align: center; padding: 80px 32px; color: #555; }
        .empty h2 { font-size: 18px; margin-bottom: 8px; }
        .loading { text-align: center; padding: 60px 32px; color: #888; font-size: 14px; }
        .loading .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #333; border-top-color: #f4c430; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2cb491; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 80vw; text-align: center; }
        .toast.show { opacity: 1; }
        .toast-wrap { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
        .toast-wrap .open-btn { background: #fff; color: #2cb491; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .init-banner { background: #1a1a2e; border-bottom: 1px solid #f4c430; padding: 12px 32px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #f4c430; }
        .init-banner.hidden { display: none; }
        .init-bar { flex: 1; height: 4px; background: #2a2a3e; border-radius: 2px; overflow: hidden; }
        .init-bar-fill { height: 100%; background: #f4c430; transition: width 0.3s; border-radius: 2px; }
        .init-text { min-width: 200px; }

        .sponsor-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(4px);
        }
        .sponsor-modal-overlay.active { display: flex; }
        .sponsor-modal {
            background: #1a1a2e; border: 1px solid #2a2a3e;
            border-radius: 14px; width: 460px; max-width: 92vw; max-height: 88vh;
            overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: sponsorIn 0.25s ease;
        }
        @keyframes sponsorIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .sponsor-header {
            display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 0;
        }
        .sponsor-header h2 { font-size: 18px; font-weight: 700; color: #f4c430; margin: 0; }
        .sponsor-close {
            background: none; border: none; color: #888;
            font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all 0.2s;
        }
        .sponsor-close:hover { background: rgba(255,255,255,0.08); color: #e0e0e0; }
        .sponsor-body { padding: 18px 22px 22px; }
        .sponsor-qr-section { text-align: center; margin-bottom: 18px; }
        .sponsor-qr-section canvas, .sponsor-qr-section img {
            border-radius: 10px; border: 3px solid #2a2a3e; margin-bottom: 10px;
        }
        .sponsor-qr-label { font-size: 13px; color: #888; }
        .sponsor-actions { display: flex; gap: 10px; margin-bottom: 18px; }
        .sponsor-btn {
            flex: 1; padding: 10px 14px; border: none; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .sponsor-btn-copy { background: #f4c430; color: #000; }
        .sponsor-btn-copy:hover { filter: brightness(1.15); }
        .sponsor-btn-save {
            background: #1e1e2e; color: #e0e0e0;
            border: 1px solid #2a2a3e;
        }
        .sponsor-btn-save:hover { border-color: #f4c430; }
        .sponsor-tutorials { margin-top: 4px; }
        .sponsor-tutorials .st-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: #888; margin-bottom: 10px;
        }
        .sponsor-tutorial-link {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            background: #1e1e2e; border: 1px solid #2a2a3e;
            border-radius: 8px; color: #e0e0e0; text-decoration: none;
            font-size: 13px; cursor: pointer; transition: all 0.2s; margin-bottom: 8px;
        }
        .sponsor-tutorial-link:hover { border-color: #f4c430; background: rgba(244,196,48,0.08); }
        .sponsor-tutorial-icon {
            width: 32px; height: 32px; border-radius: 6px;
            background: #f4c430; color: #000;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; flex-shrink: 0;
        }
        .sponsor-tutorial-info { flex: 1; }
        .sponsor-tutorial-title { font-weight: 600; }
        .sponsor-tutorial-desc { font-size: 11px; color: #888; margin-top: 2px; }
        .sponsor-tutorial-arrow { color: #888; font-size: 12px; }
        .sponsor-footer {
            text-align: center; padding-top: 14px; border-top: 1px solid #2a2a3e;
            font-size: 11px; color: #888;
        }
        .sponsor-footer a { color: #f4c430; text-decoration: none; }
        .sponsor-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <h1>ACGN Studio</h1>
        <p>明日方舟干员数据平台</p>
        <div class="search-bar">
            <input id="searchInput" type="text" placeholder="搜索干员名称..." />
            <button onclick="doSearch()">搜索</button>
            <button onclick="openSponsorModal()" style="background:transparent;color:#f4c430;border:1px solid #f4c430">赞助</button>
        </div>
    </div>
    <div class="init-banner hidden" id="initBanner">
        <span class="init-text" id="initText">正在初始化数据库...</span>
        <div class="init-bar"><div class="init-bar-fill" id="initBarFill" style="width:0%"></div></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">
        <h2>暂无数据</h2>
        <p>数据库正在初始化中，请稍候...</p>
    </div>
    <div class="detail-overlay" id="detailOverlay">
        <button class="detail-close" onclick="closeDetail()">X</button>
        <div class="detail-panel" id="detailPanel"></div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        let allCharacters = [];
        let currentAudio = null;
        let currentChar = null;

        async function pollInit() {
            try {
                const res = await fetch('/api/init-status');
                const s = await res.json();
                if (s.done) {
                    document.getElementById('initBanner').classList.add('hidden');
                    loadCharacters();
                    return;
                }
                if (s.running || s.total > 0) {
                    document.getElementById('initBanner').classList.remove('hidden');
                    const pct = s.total > 0 ? Math.round((s.current / s.total) * 100) : 0;
                    document.getElementById('initBarFill').style.width = pct + '%';
                    document.getElementById('initText').textContent = s.total > 0
                        ? `正在初始化数据库... ${s.current}/${s.total} (${pct}%)`
                        : '正在获取干员列表...';
                }
            } catch (e) {}
            setTimeout(pollInit, 2000);
        }

        async function loadCharacters() {
            const res = await fetch('/api/characters');
            allCharacters = await res.json();
            document.getElementById('stats').textContent = `共 ${allCharacters.length} 名干员`;
            renderGrid(allCharacters);
        }

        function renderGrid(list) {
            const grid = document.getElementById('grid');
            const empty = document.getElementById('empty');
            if (list.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            grid.innerHTML = list.map(c => `
                <div class="card" onclick="showDetail(${c.id})">
                    <img class="card-img" src="${c.avatar_url}" alt="${c.name}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22267%22><rect fill=%22%2312121e%22 width=%22200%22 height=%22267%22/><text fill=%22%23555%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22>暂无</text></svg>'">
                    <div class="card-body">
                        <div class="card-name">${c.name}</div>
                        <div class="card-meta">
                            <span class="card-tag tag-rarity">${c.rarity ? '★'.repeat(c.rarity) : ''}</span>
                            <span class="card-tag tag-profession">${c.profession || ''}</span>
                            <span class="card-tag tag-faction">${c.faction || ''}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) { renderGrid(allCharacters); return; }
            const filtered = allCharacters.filter(c => c.name.includes(q));
            renderGrid(filtered);
        }

        document.getElementById('searchInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });

        const ILLUST_LABELS = { elite0: '精0立绘', elite2: '精2立绘' };

        async function showDetail(id) {
            const c = allCharacters.find(x => x.id === id);
            if (!c) return;
            currentChar = c;

            document.getElementById('detailPanel').innerHTML = `
                <div class="loading"><div class="spinner"></div><div>正在加载 ${c.name} 的详细数据...</div></div>`;
            document.getElementById('detailOverlay').classList.add('active');

            let detail;
            try {
                const res = await fetch(`/api/characters/${id}/detail`);
                detail = await res.json();
                if (detail.error) throw new Error(detail.error);
            } catch (e) {
                document.getElementById('detailPanel').innerHTML = `
                    <div class="loading">加载失败: ${e.message}</div>`;
                return;
            }

            currentChar = detail;
            const illustrations = Object.entries(detail.illustration_urls || {});
            const voices = detail.voice_lines || [];
            const voiceUrls = detail.voice_urls || {};

            let html = `
                <img class="detail-illustration" src="${detail.illustration_urls?.elite2 || detail.illustration_urls?.elite0 || detail.avatar_url}" alt="${detail.name}" />
                <div class="detail-info">
                    <div class="detail-name">${detail.name}</div>
                    <div class="detail-tags">
                        <span class="card-tag tag-rarity">${detail.rarity ? '★'.repeat(detail.rarity) : ''}</span>
                        <span class="card-tag tag-profession">${detail.profession || ''}</span>
                        <span class="card-tag tag-faction">${detail.faction || ''}</span>
                    </div>
            `;

            if (illustrations.length > 0) {
                html += `<div class="detail-section"><h3>立绘 <button class="batch-btn" onclick="downloadAllIllustrations()">全部下载</button></h3><div class="illustration-grid">`;
                for (const [key, url] of illustrations) {
                    const label = ILLUST_LABELS[key] || key;
                    const fname = `${detail.name}_${label}.png`;
                    html += `
                        <div class="illust-card">
                            <img src="${url}" alt="${detail.name} ${key}" loading="lazy" />
                            <button class="illust-dl" id="dl-il-${key}" onclick="event.stopPropagation();downloadFile('${url}','${fname}','dl-il-${key}')">⬇</button>
                            <div class="illust-label">${label}</div>
                        </div>`;
                }
                html += `</div></div>`;
            }

            if (voices.length > 0) {
                html += `<div class="detail-section"><h3>语音 (${voices.length}) <button class="batch-btn" onclick="downloadAllVoices()">全部下载</button></h3>`;
                for (const v of voices) {
                    const vk = v.file?.replace('.wav', '').toLowerCase() || '';
                    const audioUrl = voiceUrls[vk] || '';
                    const fname = `${detail.name}_${v.title || vk}.mp3`;
                    html += `
                        <div class="voice-item">
                            <button class="voice-play" onclick="playVoice('${audioUrl}')">▶</button>
                            <span class="voice-title">${v.title}</span>
                            <span class="voice-text">${v.text}</span>
                            <button class="voice-copy" title="复制台词" onclick="copyText(this, '${v.text.replace(/'/g, "\\'")}')">复制</button>
                            <button class="voice-dl" id="dl-vc-${vk}" onclick="event.stopPropagation();downloadFile('${audioUrl}','${fname}','dl-vc-${vk}')">⬇</button>
                        </div>`;
                }
                html += `</div>`;
            }

            html += `</div>`;
            document.getElementById('detailPanel').innerHTML = html;
        }

        function closeDetail() {
            document.getElementById('detailOverlay').classList.remove('active');
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            currentChar = null;
        }

        function playVoice(url) {
            if (currentAudio) { currentAudio.pause(); }
            currentAudio = new Audio(url);
            currentAudio.play();
        }

        async function copyText(btn, text) {
            try {
                await navigator.clipboard.writeText(text);
                btn.textContent = '已复制';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '已复制';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
            }
        }

        async function downloadFile(url, filename, btnId) {
            const btn = document.getElementById(btnId);
            if (btn) btn.textContent = '...';
            const charName = currentChar?.name || '';
            try {
                const res = await fetch(`/api/download?url=${encodeURIComponent(url)}&filename=${encodeURIComponent(filename)}&character=${encodeURIComponent(charName)}`);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                if (btn) { btn.textContent = '✓'; btn.classList.add('done'); }
                showToastWithOpen(`已下载 ${filename}`, data.path.replace(/[^\\/]+$/, ''));
            } catch (e) {
                if (btn) btn.textContent = '⬇';
                showToast(`下载失败: ${filename}`);
            }
        }

        async function downloadAllIllustrations() {
            if (!currentChar) return;
            const items = Object.entries(currentChar.illustration_urls || {}).map(([key, url]) => {
                const label = ILLUST_LABELS[key] || key;
                return { url, filename: `${currentChar.name}_${label}.png` };
            });
            showToast(`开始下载 ${items.length} 张立绘...`);
            try {
                const res = await fetch(`/api/download/batch?urls=${encodeURIComponent(JSON.stringify(items))}&character=${encodeURIComponent(currentChar.name)}`);
                const data = await res.json();
                showToastWithOpen(`下载完成，共 ${data.files.length} 个文件`, data.dir);
            } catch (e) {
                showToast('批量下载失败');
            }
        }

        async function downloadAllVoices() {
            if (!currentChar) return;
            const voiceUrls = currentChar.voice_urls || {};
            const items = currentChar.voice_lines.map(v => {
                const vk = v.file?.replace('.wav', '').toLowerCase() || '';
                return { url: voiceUrls[vk], filename: `${currentChar.name}_${v.title || vk}.mp3` };
            }).filter(x => x.url);
            showToast(`开始下载 ${items.length} 条语音...`);
            try {
                const res = await fetch(`/api/download/batch?urls=${encodeURIComponent(JSON.stringify(items))}&character=${encodeURIComponent(currentChar.name)}`);
                const data = await res.json();
                showToastWithOpen(`下载完成，共 ${data.files.length} 个文件`, data.dir);
            } catch (e) {
                showToast('批量下载失败');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function showToastWithOpen(msg, dir) {
            const t = document.getElementById('toast');
            t.innerHTML = `<div class="toast-wrap"><span>${msg}</span><button class="open-btn" onclick="openFolder('${dir.replace(/\\/g, '\\\\')}')">打开文件夹</button></div>`;
            t.classList.add('show');
            clearTimeout(t._hideTimer);
            t._hideTimer = setTimeout(() => t.classList.remove('show'), 8000);
        }

        async function openFolder(dir) {
            try {
                await fetch(`/api/open-folder?path=${encodeURIComponent(dir)}`);
            } catch (e) {}
        }

        document.getElementById('detailOverlay').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeDetail();
        });

        pollInit();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <div class="sponsor-modal-overlay" id="sponsorModalOverlay" onclick="if(event.target===this)closeSponsorModal()">
        <div class="sponsor-modal">
            <div class="sponsor-header">
                <h2 id="sponsorTitle">赞助与教程</h2>
                <button class="sponsor-close" onclick="closeSponsorModal()">&times;</button>
            </div>
            <div class="sponsor-body" id="sponsorBody">
                <div class="loading" style="padding:20px">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        let _sponsorConfig = null;

        async function loadSponsorConfig() {
            if (_sponsorConfig) return _sponsorConfig;
            try {
                const res = await fetch('/api/sponsor/config');
                _sponsorConfig = await res.json();
            } catch(e) { _sponsorConfig = { methods: [], tutorials: [] }; }
            return _sponsorConfig;
        }

        async function openSponsorModal() {
            document.getElementById('sponsorModalOverlay').classList.add('active');
            const cfg = await loadSponsorConfig();
            const body = document.getElementById('sponsorBody');
            document.getElementById('sponsorTitle').textContent = '赞助与教程';

            let html = '';

            // 赞助方式 - 点击展开二维码
            html += '<div style="display:flex;gap:12px;justify-content:center;margin-bottom:18px;flex-wrap:wrap">';
            for (const m of (cfg.methods || [])) {
                const id = 'sm_' + m.name.replace(/\s/g, '_');
                html += '<div style="text-align:center">';
                html += '<button class="sponsor-btn" onclick="toggleQr(\'' + id + '\', \'' + (m.qr_image || '') + '\', \'' + (m.url || '') + '\')" style="min-width:80px">';
                html += m.icon + ' ' + m.name;
                html += '</button>';
                html += '</div>';
            }
            html += '</div>';

            // 二维码展示区（默认隐藏）
            html += '<div id="qrDisplay" style="text-align:center;display:none;margin-bottom:18px">';
            html += '<img id="qrImg" src="" style="max-width:220px;border-radius:10px;border:3px solid #2a2a3e;display:none" />';
            html += '<div id="qrLoading" style="display:none;color:#888">加载中...</div>';
            html += '</div>';

            // 教程
            if ((cfg.tutorials || []).length > 0) {
                html += '<div class="sponsor-tutorials"><div class="st-label">教程</div>';
                for (const t of cfg.tutorials) {
                    html += '<a class="sponsor-tutorial-link" onclick="openTutorial(\'' + t.url + '\')">';
                    html += '<div class="sponsor-tutorial-icon">' + (t.icon || '▶') + '</div>';
                    html += '<div class="sponsor-tutorial-info"><div class="sponsor-tutorial-title">' + t.title + '</div>';
                    html += '<div class="sponsor-tutorial-desc">' + (t.desc || '点击在系统浏览器中打开') + '</div></div>';
                    html += '<div class="sponsor-tutorial-arrow">&#9656;</div></a>';
                }
                html += '</div>';
            }

            // 页脚
            html += '<div class="sponsor-footer">' + (cfg.project_name || '') + ' v' + (cfg.project_version || '') + '</div>';
            body.innerHTML = html;
        }

        let _currentQr = null;
        function toggleQr(id, qrImage, url) {
            const display = document.getElementById('qrDisplay');
            const img = document.getElementById('qrImg');
            const loading = document.getElementById('qrLoading');

            // 点击同一个按钮则关闭
            if (_currentQr === id) {
                display.style.display = 'none';
                img.style.display = 'none';
                _currentQr = null;
                return;
            }

            _currentQr = id;

            if (qrImage) {
                // 显示二维码
                display.style.display = 'block';
                loading.style.display = 'block';
                img.style.display = 'none';
                const qrSrc = qrImage.startsWith('http') ? qrImage : '/api/sponsor/assets/' + qrImage;
                img.onload = function() {
                    loading.style.display = 'none';
                    img.style.display = 'block';
                };
                img.onerror = function() {
                    loading.style.display = 'none';
                    display.style.display = 'none';
                    _currentQr = null;
                };
                img.src = qrSrc;
            } else if (url) {
                // 纯链接，直接打开
                display.style.display = 'none';
                openTutorial(url);
            }
        }

        function closeSponsorModal() {
            document.getElementById('sponsorModalOverlay').classList.remove('active');
        }

        async function openTutorial(url) {
            try {
                await fetch('/api/sponsor/open-external', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'url=' + encodeURIComponent(url)
                });
            } catch(e) { window.open(url, '_blank'); }
        }
    </script>
</body>
</html>
